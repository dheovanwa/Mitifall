; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Target: ESP32-C3 SuperMini (a.k.a. "Nologo ESP32-C3 Super Mini")
; PlatformIO has no dedicated board entry for this clone, so we use the generic
; ESP32-C3-DevKitM-1 board: same MCU, 4MB flash, no PSRAM. Its "esp32c3" pin
; variant matches the SuperMini bus pinout (SDA=8, SCL=9, TX=21, RX=20,
; SCK=4, MISO=5, MOSI=6, SS=7), so no custom variant is needed.
; Caveat: the generic variant declares GPIO8 as an addressable RGB LED
; (neopixelWrite). The SuperMini has a plain active-low LED there, so drive it
; with digitalWrite(8, LOW/HIGH) rather than LED_BUILTIN / RGB_BUILTIN.
[env:esp32c3_supermini]
platform = espressif32@^7.1.3
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; The SuperMini has no USB-UART bridge: the USB-C port goes straight to the
; ESP32-C3 USB Serial/JTAG peripheral. Serial output only shows up over USB
; when the Arduino core routes Serial to the native USB CDC device.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
